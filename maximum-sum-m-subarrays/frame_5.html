<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 40px; padding: 48px; background: #262626; border: 1px solid #404040; position: relative; width: 800px; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .row-wrapper { display: flex; flex-direction: column; gap: 12px; background: #1f1f1f; padding: 24px; border-radius: 12px; border: 1px solid #404040; }
        .row-title { font-weight: 800; font-size: 1.1rem; color: #f3f4f6; display: flex; justify-content: space-between; }
        
        .array-row { display: flex; gap: 8px; justify-content: flex-start; position: relative; margin-top: 10px; }
        .array-box { width: 56px; height: 56px; border: 2px solid #525252; background: #171717; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700; color: #d4d4d4; }
        
        .box-prev { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #93c5fd; }
        .box-curr { background: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #6ee7b7; }
        
        .equation { font-family: monospace; font-size: 1.2rem; font-weight: 700; color: #e5e7eb; display: flex; align-items: center; gap: 12px; margin-top: 10px;}
        .eq-highlight { color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">DRY RUN: dp[2][4]</div>
        
        <div style="display: flex; flex-direction: column; gap: 24px;">
            <!-- Possibility 1 -->
            <div class="row-wrapper">
                <div class="row-title"><span>Possibility 1: Length = 1</span> <span style="color: #9ca3af;">j = 3</span></div>
                <div class="array-row">
                    <div class="array-box box-prev">4</div>
                    <div class="array-box box-prev">1</div>
                    <div class="array-box box-prev">-5</div>
                    <div class="array-box box-curr">2</div>
                </div>
                <div class="equation">dp[1][3] + <span class="eq-highlight">2</span></div>
            </div>
            
            <!-- Possibility 2 -->
            <div class="row-wrapper">
                <div class="row-title"><span>Possibility 2: Length = 2</span> <span style="color: #9ca3af;">j = 2</span></div>
                <div class="array-row">
                    <div class="array-box box-prev">4</div>
                    <div class="array-box box-prev">1</div>
                    <div class="array-box box-curr">-5</div>
                    <div class="array-box box-curr">2</div>
                </div>
                <div class="equation">dp[1][2] + <span class="eq-highlight">(-3)</span></div>
            </div>
            
            <!-- Possibility 3 -->
            <div class="row-wrapper">
                <div class="row-title"><span>Possibility 3: Length = 3</span> <span style="color: #9ca3af;">j = 1</span></div>
                <div class="array-row">
                    <div class="array-box box-prev">4</div>
                    <div class="array-box box-curr">1</div>
                    <div class="array-box box-curr">-5</div>
                    <div class="array-box box-curr">2</div>
                </div>
                <div class="equation">dp[1][1] + <span class="eq-highlight">(-2)</span></div>
            </div>
        </div>
        
    </div>
</body>
</html>
