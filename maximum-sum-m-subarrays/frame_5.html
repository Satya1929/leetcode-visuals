<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; padding: 30px; width: max-content; color: #e5e7eb; }
        .frame { display: flex; flex-direction: column; gap: 20px; padding: 40px; background: #171717; border: 1px solid #404040; border-radius: 16px; width: 800px; }
        .title { font-size: 1.5rem; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 0.1em; text-align: center; margin-bottom: 20px;}
        
        .ladder { display: flex; flex-direction: column; gap: 16px; width: 100%; position: relative; }
        
        .step { display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; border-radius: 12px; font-weight: 800; border: 2px solid; position: relative; }
        
        .step-name { font-size: 1.2rem; }
        .step-comp { font-family: monospace; font-size: 1.4rem; }
        
        .s1 { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); color: #fca5a5; width: 60%; margin-top: auto; }
        .s2 { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); color: #fcd34d; width: 80%; }
        .s3 { border-color: #10b981; background: rgba(16, 185, 129, 0.1); color: #6ee7b7; width: 100%; box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }
        
        .arrow-up { position: absolute; left: 40px; font-size: 2rem; color: #525252; font-weight: 900; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">The Complexity Ladder</div>
        
        <div class="ladder">
            <div class="step s3">
                <div class="step-name">Tabulation + Deque</div>
                <div class="step-comp">O(N × M)</div>
            </div>
            
            <div class="step s2">
                <div class="step-name">Memoization</div>
                <div class="step-comp">O(N × M × len)</div>
            </div>
            
            <div class="step s1">
                <div class="step-name">Pure Recursion</div>
                <div class="step-comp">Exponential</div>
            </div>
        </div>
    </div>
</body>
</html>
