<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; padding: 30px; width: max-content; color: #e5e7eb; }
        .frame { display: flex; flex-direction: column; gap: 30px; padding: 40px; background: #171717; border: 1px solid #404040; border-radius: 16px; width: 750px; }
        .title { font-size: 1.5rem; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
        
        .compare-row { display: flex; align-items: center; justify-content: space-between; background: #262626; padding: 24px; border-radius: 12px; border: 1px solid #404040; gap: 20px;}
        
        .label { font-size: 1.1rem; font-weight: 800; color: #9ca3af; width: 120px; }
        .code-box { font-family: monospace; font-size: 1.3rem; font-weight: 800; padding: 12px 20px; border-radius: 8px; background: #1f1f1f; color: #f3f4f6; flex-grow: 1; text-align: center; border: 1px solid #525252; }
        
        .complexity { font-weight: 900; font-size: 1.2rem; padding: 8px 16px; border-radius: 8px; width: 100px; text-align: center; }
        .comp-bad { color: #f87171; background: rgba(248, 113, 113, 0.1); border: 1px solid rgba(248, 113, 113, 0.2); }
        .comp-good { color: #34d399; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52, 211, 153, 0.2); }
        
        .arrow-down { text-align: center; font-size: 2rem; color: #525252; font-weight: 900; }
        
        .highlight { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">The Prefix Optimization</div>
        
        <div class="compare-row">
            <div class="label">Before</div>
            <div class="code-box">sum(i...i+len-1)</div>
            <div class="complexity comp-bad">O(len)</div>
        </div>
        
        <div class="arrow-down">↓</div>
        
        <div class="compare-row" style="border-color: #3b82f6; background: rgba(59, 130, 246, 0.05);">
            <div class="label" style="color: #60a5fa;">After</div>
            <div class="code-box" style="border-color: #60a5fa;">pre[<span class="highlight">i+len</span>] - pre[<span class="highlight">i</span>]</div>
            <div class="complexity comp-good">O(1)</div>
        </div>
    </div>
</body>
</html>
