<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; padding: 30px; width: max-content; color: #e5e7eb; }
        .frame { display: flex; flex-direction: column; gap: 30px; padding: 40px; background: #171717; border: 1px solid #404040; border-radius: 16px; width: 850px; align-items: center; }
        .title { font-size: 1.5rem; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
        
        .pipeline { display: flex; flex-direction: row; gap: 16px; align-items: center; margin-top: 20px;}
        .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; background: #262626; border: 2px solid #525252; border-radius: 12px; width: 140px; text-align: center; }
        .stage-active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .stage-final { border-color: #10b981; background: rgba(16, 185, 129, 0.1); box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
        
        .stage-title { font-size: 1.1rem; font-weight: 800; color: #f3f4f6; }
        .stage-desc { font-size: 0.85rem; font-weight: 600; color: #9ca3af; }
        
        .arrow { font-size: 1.5rem; font-weight: 900; color: #525252; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">The DP Derivation Journey</div>
        
        <div class="pipeline">
            <div class="stage">
                <div class="stage-title">Brute Force</div>
                <div class="stage-desc">Exponential</div>
            </div>
            <div class="arrow">→</div>
            <div class="stage">
                <div class="stage-title">Recursion</div>
                <div class="stage-desc">State: (i, k)</div>
            </div>
            <div class="arrow">→</div>
            <div class="stage stage-active">
                <div class="stage-title">Memoization</div>
                <div class="stage-desc">Cache results</div>
            </div>
            <div class="arrow">→</div>
            <div class="stage stage-active">
                <div class="stage-title">Prefix Sum</div>
                <div class="stage-desc">O(1) ranges</div>
            </div>
            <div class="arrow">→</div>
            <div class="stage stage-final">
                <div class="stage-title">Prefix DP</div>
                <div class="stage-desc">Fix last interval</div>
            </div>
        </div>
    </div>
</body>
</html>
