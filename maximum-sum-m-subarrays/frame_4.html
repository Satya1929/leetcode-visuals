<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 30px; padding: 48px; background: #262626; border: 1px solid #404040; position: relative; width: 600px; align-items: center; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .array-row { display: flex; gap: 4px; justify-content: flex-start; width: 264px; }
        .array-box { width: 60px; height: 60px; border: 2px solid #525252; background: #171717; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 700; color: #d4d4d4; }
        .box-active { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #93c5fd; }
        .box-empty { border: 2px dashed #404040; background: transparent; }
        
        .row-wrapper { display: flex; align-items: center; gap: 24px; }
        .row-label { font-family: monospace; font-size: 1.1rem; font-weight: 600; color: #9ca3af; width: 60px; text-align: right; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">PREFIX GROWTH</div>
        
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="row-wrapper">
                <div class="row-label">i = 1</div>
                <div class="array-row">
                    <div class="array-box box-active">4</div>
                    <div class="array-box box-empty"></div>
                    <div class="array-box box-empty"></div>
                    <div class="array-box box-empty"></div>
                </div>
            </div>
            
            <div class="row-wrapper">
                <div class="row-label">i = 2</div>
                <div class="array-row">
                    <div class="array-box box-active">4</div>
                    <div class="array-box box-active">1</div>
                    <div class="array-box box-empty"></div>
                    <div class="array-box box-empty"></div>
                </div>
            </div>
            
            <div class="row-wrapper">
                <div class="row-label">i = 3</div>
                <div class="array-row">
                    <div class="array-box box-active">4</div>
                    <div class="array-box box-active">1</div>
                    <div class="array-box box-active">-5</div>
                    <div class="array-box box-empty"></div>
                </div>
            </div>
            
            <div class="row-wrapper">
                <div class="row-label">i = 4</div>
                <div class="array-row">
                    <div class="array-box box-active">4</div>
                    <div class="array-box box-active">1</div>
                    <div class="array-box box-active">-5</div>
                    <div class="array-box box-active">2</div>
                </div>
            </div>
        </div>
        
        <div style="text-align: center; color: #a3a3a3; font-size: 1.1rem; margin-top: 10px;">
            Each larger prefix is built completely from smaller prefixes.
        </div>
    </div>
</body>
</html>
