<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 48px; padding: 32px 48px; background: #262626; border: 1px solid #404040; position: relative; width: 800px; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .data-table { font-size: 1rem; border-collapse: collapse; text-align: center; width: 100%; }
        .data-table th { color: #9ca3af; font-weight: 700; padding: 12px; border-bottom: 2px solid #525252; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.85rem; }
        .data-table td { padding: 16px 12px; border-bottom: 1px solid #404040; color: #d4d4d4; }
        .data-table tr:last-child td { border-bottom: none; }
        
        .array-box { display: inline-flex; width: 32px; height: 32px; border: 1px solid #525252; background: #171717; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: #d4d4d4; margin: 0 2px; }
        .box-blue { background: #2563eb; border-color: #60a5fa; color: white; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">DRY RUN: Computing dp[2][4]</div>
        <div style="text-align: center; margin-top: -30px; margin-bottom: 10px; color: #a3a3a3; font-weight: 600;">
            nums = <div class="array-box">4</div><div class="array-box">1</div><div class="array-box">-5</div><div class="array-box box-blue">2</div>
        </div>
        
        <table class="data-table">
            <tr>
                <th>Last Interval</th>
                <th>Prev. index (j)</th>
                <th>Prefix Value</th>
                <th>Interval Sum</th>
                <th>Total dp[2][4]</th>
            </tr>
            <tr>
                <td style="color: #60a5fa; font-weight: 600;">[2]</td>
                <td>j = 3</td>
                <td>dp[1][3]</td>
                <td style="color: #4ade80;">+2</td>
                <td>dp[1][3] + 2</td>
            </tr>
            <tr>
                <td style="color: #60a5fa; font-weight: 600;">[-5, 2]</td>
                <td>j = 2</td>
                <td>dp[1][2]</td>
                <td style="color: #ef4444;">-3</td>
                <td>dp[1][2] - 3</td>
            </tr>
            <tr>
                <td style="color: #60a5fa; font-weight: 600;">[1, -5, 2]</td>
                <td>j = 1</td>
                <td>dp[1][1]</td>
                <td style="color: #ef4444;">-2</td>
                <td>dp[1][1] - 2</td>
            </tr>
        </table>
        
        <div style="text-align: center; color: #4ade80; font-weight: 700; font-size: 1.1rem; margin-top: -10px;">
            dp[2][4] = max of all scenarios
        </div>
    </div>
</body>
</html>
