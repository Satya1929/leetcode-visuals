<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; padding: 30px; width: max-content; color: #e5e7eb; }
        .frame { display: flex; flex-direction: column; gap: 40px; padding: 48px; background: #171717; border: 1px solid #404040; border-radius: 16px; width: 700px; align-items: center; }
        .title { font-size: 1.5rem; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
        
        .tree { display: flex; flex-direction: column; align-items: center; width: 100%; position: relative; }
        
        .node { padding: 16px 32px; background: #262626; border: 2px solid #525252; border-radius: 8px; font-size: 1.25rem; font-weight: 800; color: #f3f4f6; font-family: monospace; z-index: 10; position: relative;}
        .node-root { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .node-leaf { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
        
        .branches { display: flex; justify-content: space-between; width: 450px; margin-top: 60px; position: relative; }
        
        .line-left { position: absolute; width: 2px; height: 80px; background: #525252; top: -75px; left: 50%; transform: rotate(35deg); transform-origin: top left; }
        .line-right { position: absolute; width: 2px; height: 80px; background: #525252; top: -75px; right: 50%; transform: rotate(-35deg); transform-origin: top right; }
        
        .label { position: absolute; top: -40px; font-weight: 800; font-size: 0.9rem; color: #9ca3af; background: #171717; padding: 4px 8px; border-radius: 4px; }
        .label-left { left: 10%; }
        .label-right { right: 10%; }
        
        .leaf-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .leaf-desc { font-size: 0.85rem; font-weight: 600; color: #6ee7b7; background: rgba(16, 185, 129, 0.1); padding: 4px 12px; border-radius: 12px; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">The Decision Tree</div>
        
        <div class="tree">
            <div class="node node-root">solve(i, k)</div>
            
            <div class="branches">
                <div class="line-left"></div>
                <div class="line-right"></div>
                
                <div class="label label-left">Skip i</div>
                <div class="label label-right">Take len ∈ [l,r]</div>
                
                <div class="leaf-wrapper">
                    <div class="node node-leaf">solve(i+1, k)</div>
                    <div class="leaf-desc">k remains same</div>
                </div>
                
                <div class="leaf-wrapper">
                    <div class="node node-leaf">solve(i+len, k-1)</div>
                    <div class="leaf-desc">+ sum(i...i+len-1)</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
