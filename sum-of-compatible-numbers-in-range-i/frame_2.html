<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 32px; padding: 32px 48px; background: #262626; border: 1px solid #404040; position: relative; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .array-container { display: flex; gap: 16px; margin-bottom: 24px; align-items: flex-start; justify-content: center; }
        .array-wrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .array-box { width: 80px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px solid #525252; background: #171717; font-weight: 700; color: #d4d4d4; position: relative; }
        .box-label { font-size: 0.85rem; color: #9ca3af; margin-bottom: 4px; }
        .box-value { font-size: 1.5rem; }
        
        .array-box.valid { border-color: #4ade80; background: rgba(74, 222, 128, 0.1); color: #4ade80; }
        .array-box.invalid { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); opacity: 0.6; }
        
        .calc-text { font-family: monospace; font-size: 0.85rem; text-align: center; letter-spacing: 0.05em; }
        .calc-text.valid { color: #4ade80; }
        .calc-text.invalid { color: #ef4444; }
        
        .callout { background: #171717; border-left: 4px solid #2563eb; padding: 24px; max-width: 600px; display: flex; flex-direction: column; gap: 12px; margin: 0 auto; }
        .callout-title { font-weight: 800; font-size: 1.1rem; color: #2563eb; text-transform: uppercase; letter-spacing: 0.05em; text-align: center; }
        .sum-box { font-size: 1.5rem; font-weight: 800; color: #4ade80; text-align: center; padding: 16px; border: 2px dashed #4ade80; background: rgba(74, 222, 128, 0.05); border-radius: 8px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">STEP 2: BITWISE AND CHECK & SUMMATION</div>
        
        <div class="callout-title">Condition 2: (n & x) == 0</div>
        
        <div class="array-container">
            <div class="array-wrapper">
                <div class="array-box valid">
                    <div class="box-label">x</div>
                    <div class="box-value">1</div>
                </div>
                <div class="calc-text valid">2 & 1 = 0<br>&check;</div>
            </div>
            
            <div class="array-wrapper">
                <div class="array-box invalid">
                    <div class="box-label">x</div>
                    <div class="box-value">2</div>
                </div>
                <div class="calc-text invalid">2 & 2 = 2<br>&cross;</div>
            </div>
            
            <div class="array-wrapper">
                <div class="array-box invalid">
                    <div class="box-label">x</div>
                    <div class="box-value">3</div>
                </div>
                <div class="calc-text invalid">2 & 3 = 2<br>&cross;</div>
            </div>
            
            <div class="array-wrapper">
                <div class="array-box valid">
                    <div class="box-label">x</div>
                    <div class="box-value">4</div>
                </div>
                <div class="calc-text valid">2 & 4 = 0<br>&check;</div>
            </div>
            
            <div class="array-wrapper">
                <div class="array-box valid">
                    <div class="box-label">x</div>
                    <div class="box-value">5</div>
                </div>
                <div class="calc-text valid">2 & 5 = 0<br>&check;</div>
            </div>
        </div>
        
        <div class="sum-box">
            Total Sum = 1 + 4 + 5 = 10
        </div>
    </div>
</body>
</html>
