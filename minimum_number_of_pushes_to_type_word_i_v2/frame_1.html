<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 32px; padding: 48px 64px; background: #262626; border: 1px solid #404040; position: relative; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .block-row { display: flex; align-items: stretch; gap: 16px; margin-bottom: 16px; }
        
        .math-block {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #171717; border: 2px solid #525252; border-radius: 8px;
            padding: 16px 24px; min-width: 180px;
        }
        .math-block.highlight {
            border-color: #4ade80; background: #166534;
        }
        .math-block.secondary {
            border-color: #60a5fa; background: #1e3a8a;
        }
        
        .block-title { font-size: 0.9rem; font-weight: 700; color: #a3a3a3; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em; }
        .highlight .block-title { color: #86efac; }
        .secondary .block-title { color: #93c5fd; }
        
        .formula-text { font-size: 1.4rem; font-weight: 800; font-family: 'Courier New', Courier, monospace; color: #ffffff; }
        
        .operator { display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: #737373; padding: 0 8px; }
        
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">THE BLOCK DIVISION</div>
        
        <div class="block-row">
            <div class="math-block highlight">
                <div class="block-title">Complete Blocks (q)</div>
                <div class="formula-text">8 × 1</div>
            </div>
            <div class="operator">+</div>
            <div class="math-block highlight">
                <div class="block-title">Complete Blocks (q)</div>
                <div class="formula-text">8 × 2</div>
            </div>
            <div class="operator">+</div>
            <div class="math-block" style="border: none; background: transparent;">
                <div class="formula-text" style="color: #a3a3a3;">...</div>
            </div>
            <div class="operator">+</div>
            <div class="math-block highlight">
                <div class="block-title">Complete Blocks (q)</div>
                <div class="formula-text">8 × q</div>
            </div>
        </div>
        
        <div class="block-row" style="justify-content: center; margin-top: 16px;">
            <div class="math-block secondary">
                <div class="block-title">Leftover Characters (r)</div>
                <div class="formula-text">r × (q + 1)</div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 16px; font-size: 1.1rem; color: #d4d4d4; font-weight: 600;">
            Total Cost = <span style="color: #4ade80;">8(1 + 2 + ... + q)</span> + <span style="color: #60a5fa;">r(q + 1)</span>
        </div>
    </div>
</body>
</html>
