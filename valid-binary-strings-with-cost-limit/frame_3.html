<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 20px; padding: 32px 48px; background: #262626; border: 1px solid #404040; position: relative; width: 900px; height: 600px; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; z-index: 10; }
        
        .tree-container { position: absolute; top: 80px; left: 0; width: 100%; height: 500px; }
        
        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #171717;
            border: 2px solid #525252;
            border-radius: 8px;
            padding: 8px 16px;
            z-index: 2;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            min-width: 100px;
        }
        
        .node.valid { border-color: #4ade80; background: rgba(74, 222, 128, 0.1); }
        .node.pruned { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .node.pruned-cross { border: none; background: transparent; box-shadow: none; padding: 0; }
        .node.intermediate { border-color: #3b82f6; }
        
        .node-call { font-family: monospace; font-size: 0.9rem; color: #9ca3af; margin-bottom: 4px; }
        .node-str { font-weight: 700; font-size: 1.1rem; color: #e5e7eb; letter-spacing: 0.1em; }
        .node-status { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-top: 4px; }
        .node.valid .node-status { color: #4ade80; }
        .node.pruned .node-status { color: #ef4444; }
        
        .edge-label {
            position: absolute;
            transform: translate(-50%, -50%);
            background: #262626;
            padding: 2px 6px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #d4d4d4;
            z-index: 3;
            border-radius: 4px;
        }
        
        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        line {
            stroke: #525252;
            stroke-width: 2;
        }
        
        line.pruned-edge {
            stroke-dasharray: 4;
            stroke: #737373;
        }
    </style>
</head>
<body>
    <div class="frame" id="frame">
        <div class="title">RECURSION TREE: DRY RUN (n=3, k=1)</div>
        <div class="tree-container" id="tree">
            <svg id="svg-canvas"></svg>
            <!-- Nodes will be injected here -->
        </div>
    </div>
    
    <script>
        const nodes = [
            { id: 'n0', x: 450, y: 50, call: 'f(0,0,0)', str: '""', type: 'intermediate' },
            
            { id: 'n1', x: 245, y: 170, call: 'f(1,0,0)', str: '"0"', type: 'intermediate', parent: 'n0', edgeLabel: "+ '0'" },
            { id: 'n2', x: 668, y: 170, call: 'f(1,0,1)', str: '"1"', type: 'intermediate', parent: 'n0', edgeLabel: "+ '1'" },
            
            { id: 'n3', x: 135, y: 300, call: 'f(2,0,0)', str: '"00"', type: 'intermediate', parent: 'n1', edgeLabel: "+ '0'" },
            { id: 'n4', x: 355, y: 300, call: 'f(2,1,1)', str: '"01"', type: 'intermediate', parent: 'n1', edgeLabel: "+ '1'" },
            
            { id: 'n5', x: 575, y: 300, call: 'f(2,0,0)', str: '"10"', type: 'intermediate', parent: 'n2', edgeLabel: "+ '0'" },
            { id: 'n12', x: 760, y: 300, call: '-', str: '"11"', type: 'pruned-cross', parent: 'n2', edgeLabel: "+ '1'" },
            
            { id: 'n6', x: 80, y: 440, call: 'f(3,0,0)', str: '"000"', type: 'valid', status: 'Valid', parent: 'n3', edgeLabel: "+ '0'" },
            { id: 'n7', x: 190, y: 440, call: 'f(3,2,1)', str: '"001"', type: 'pruned', status: 'Invalid', parent: 'n3', edgeLabel: "+ '1'" },
            
            { id: 'n8', x: 300, y: 440, call: 'f(3,1,0)', str: '"010"', type: 'valid', status: 'Valid', parent: 'n4', edgeLabel: "+ '0'" },
            { id: 'n11', x: 410, y: 440, call: '-', str: '"011"', type: 'pruned-cross', parent: 'n4', edgeLabel: "+ '1'" },
            
            { id: 'n9', x: 520, y: 440, call: 'f(3,0,0)', str: '"100"', type: 'valid', status: 'Valid', parent: 'n5', edgeLabel: "+ '0'" },
            { id: 'n10', x: 630, y: 440, call: 'f(3,2,1)', str: '"101"', type: 'pruned', status: 'Invalid', parent: 'n5', edgeLabel: "+ '1'" }
        ];

        const treeEl = document.getElementById('tree');
        const svgEl = document.getElementById('svg-canvas');

        // Draw edges
        nodes.forEach(node => {
            if (node.parent) {
                const parent = nodes.find(n => n.id === node.parent);
                
                // SVG Line
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', parent.x);
                line.setAttribute('y1', parent.y);
                line.setAttribute('x2', node.x);
                line.setAttribute('y2', node.y);
                if (node.type === 'pruned') {
                    line.classList.add('pruned-edge');
                }
                svgEl.appendChild(line);
                
                // Edge Label
                if (node.edgeLabel) {
                    const label = document.createElement('div');
                    label.className = 'edge-label';
                    const midX = (parent.x + node.x) / 2;
                    const midY = (parent.y + node.y) / 2;
                    label.style.left = midX + 'px';
                    label.style.top = midY + 'px';
                    label.innerText = node.edgeLabel;
                    treeEl.appendChild(label);
                }
            }
        });

        // Draw nodes
        nodes.forEach(node => {
            const el = document.createElement('div');
            el.className = `node ${node.type}`;
            el.style.left = node.x + 'px';
            el.style.top = node.y + 'px';
            
            let html = '';
            if (node.type === 'pruned-cross') {
                html = `<div class="node-str" style="color: #737373;">${node.str}</div>
                        <div style="color: #ef4444; font-size: 2.5rem; font-weight: 900; line-height: 1; margin-top: 4px;">✕</div>`;
            } else {
                html = `<div class="node-call">${node.call}</div>
                        <div class="node-str">${node.str === '""' ? 'Empty' : node.str}</div>`;
                if (node.status) {
                    html += `<div class="node-status">${node.status}</div>`;
                }
            }
            
            el.innerHTML = html;
            treeEl.appendChild(el);
        });
    </script>
</body>
</html>
