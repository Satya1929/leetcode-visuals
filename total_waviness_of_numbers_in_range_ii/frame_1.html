<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 48px; padding: 32px 48px; background: #262626; border: 1px solid #404040; position: relative; width: 800px; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .array-container { display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 32px; }
        .array-box { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 8px; border: 2px solid #525252; background: #171717; font-size: 1.5rem; font-weight: 700; color: #d4d4d4; }
        .array-box.highlight { background: #16a34a; border-color: #4ade80; color: #ffffff; }
        .array-box.valley { background: #2563eb; border-color: #60a5fa; color: #ffffff; }
        .array-box.invalid { background: #ef4444; border-color: #f87171; color: #ffffff; }
        
        .label { font-size: 0.9rem; font-weight: 600; color: #9ca3af; margin-top: 12px; }
        .row-label { font-size: 1.1rem; font-weight: 700; color: #ffffff; text-align: center; margin-bottom: 12px; }
        .legend { font-size: 1.1rem; font-weight: 800; color: #4ade80; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">Defining the 570 Wave Patterns</div>
        
        <div>
            <div class="row-label">Peak Pattern (a &lt; b &gt; c)</div>
            <div class="array-container">
                <div class="array-box">1</div>
                <div class="array-box highlight">2</div>
                <div class="array-box">0</div>
            </div>
        </div>

        <div>
            <div class="row-label">Valley Pattern (a &gt; b &lt; c)</div>
            <div class="array-container">
                <div class="array-box">2</div>
                <div class="array-box valley">0</div>
                <div class="array-box">1</div>
            </div>
        </div>

        <div>
            <div class="row-label">Invalid Pattern (Ascending)</div>
            <div class="array-container">
                <div class="array-box">1</div>
                <div class="array-box invalid">2</div>
                <div class="array-box">3</div>
            </div>
        </div>

    </div>
</body>
</html>
