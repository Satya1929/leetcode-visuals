<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #262626; display: flex; align-items: flex-start; justify-content: flex-start; padding: 20px; width: max-content; color: #e5e7eb; }
        .frame { display: inline-flex; flex-direction: column; gap: 48px; padding: 32px 48px; background: #262626; border: 1px solid #404040; position: relative; }
        .title { font-size: 1.15rem; font-weight: 800; color: #ffffff; text-align: center; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .matrix-container { display: flex; gap: 16px; margin-bottom: 32px; align-items: center; justify-content: center; position: relative; margin-top: 60px; }
        
        .grid-system { display: flex; flex-direction: column; position: relative; }
        .grid-header { display: grid; margin-bottom: 8px; text-align: center; font-size: 0.85rem; font-weight: 700; color: #d4d4d4; }
        .grid-header-col { display: flex; align-items: center; justify-content: center; }
        .grid-body { display: grid; border: 1px solid #525252; background: #171717; z-index: 2; position: relative; }
        .grid-cell { border-right: 1px solid #404040; border-bottom: 1px solid #404040; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.25rem; color: #ffffff; }
        .grid-row:last-child .grid-cell { border-bottom: none; }
        .grid-cell:last-child { border-right: none; }
        
        .block-even { background: #f97316; } /* Orange */
        .block-odd { background: #0ea5e9; } /* Light Blue */
        
        .legend { font-size: 1.1rem; font-weight: 800; color: #ffffff; text-align: center; margin-top: 24px; display: flex; justify-content: center; gap: 24px; }
        .legend-item { display: flex; align-items: center; gap: 8px; }
        .legend-color { width: 16px; height: 16px; border-radius: 4px; }

        .svg-overlay { position: absolute; top: -60px; left: 0; width: 480px; height: 80px; z-index: 10; pointer-events: none; }
        .arrow-path-odd { stroke: #0ea5e9; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; }
        .arrow-path-even { stroke: #f97316; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; }
        .arrow-head-odd { fill: #0ea5e9; }
        .arrow-head-even { fill: #f97316; }
    </style>
</head>
<body>
    <div class="frame">
        <div class="title">COST-FREE GROUPING BY PARITY (+/- 2 STEPS)</div>
        <div class="matrix-container">
            <div class="grid-system">
                <svg class="svg-overlay" viewBox="0 0 480 80">
                    <defs>
                        <marker id="arrow-odd" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse">
                            <polygon points="0 0, 6 3, 0 6" class="arrow-head-odd" />
                        </marker>
                        <marker id="arrow-even" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse">
                            <polygon points="0 0, 6 3, 0 6" class="arrow-head-even" />
                        </marker>
                    </defs>
                    <!-- Odd jumps -->
                    <path class="arrow-path-odd" marker-end="url(#arrow-odd)" d="M 216,68 Q 168,20 120,68" />
                    <path class="arrow-path-odd" marker-end="url(#arrow-odd)" d="M 120,68 Q 72,20 24,68" />
                    <!-- Even jumps -->
                    <path class="arrow-path-even" marker-end="url(#arrow-even)" d="M 456,68 Q 408,20 360,68" />
                    <path class="arrow-path-even" marker-end="url(#arrow-even)" d="M 360,68 Q 312,20 264,68" />
                    <path class="arrow-path-even" marker-end="url(#arrow-even)" d="M 264,68 Q 216,20 168,68" />
                    <path class="arrow-path-even" marker-end="url(#arrow-even)" d="M 168,68 Q 120,20 72,68" />
                </svg>

                <div class="grid-header" style="grid-template-columns: repeat(10, 48px);">
                    <div class="grid-header-col">1</div>
                    <div class="grid-header-col">2</div>
                    <div class="grid-header-col">3</div>
                    <div class="grid-header-col">4</div>
                    <div class="grid-header-col">5</div>
                    <div class="grid-header-col">6</div>
                    <div class="grid-header-col">7</div>
                    <div class="grid-header-col">8</div>
                    <div class="grid-header-col">9</div>
                    <div class="grid-header-col">10</div>
                </div>
                <div class="grid-body" style="grid-template-columns: repeat(10, 48px); grid-template-rows: repeat(1, 48px);">
                    <div class="grid-cell block-odd" style="grid-column: 1;">3</div>
                    <div class="grid-cell block-even" style="grid-column: 2;">4</div>
                    <div class="grid-cell" style="grid-column: 3;"></div>
                    <div class="grid-cell" style="grid-column: 4;"></div>
                    <div class="grid-cell" style="grid-column: 5;"></div>
                    <div class="grid-cell" style="grid-column: 6;"></div>
                    <div class="grid-cell" style="grid-column: 7;"></div>
                    <div class="grid-cell" style="grid-column: 8;"></div>
                    <div class="grid-cell" style="grid-column: 9;"></div>
                    <div class="grid-cell" style="grid-column: 10;"></div>
                </div>
            </div>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-color block-odd"></div> Odd Positions (Cost 0)</div>
            <div class="legend-item"><div class="legend-color block-even"></div> Even Positions (Cost 0)</div>
        </div>
    </div>
</body>
</html>
